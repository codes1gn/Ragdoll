[tool.poetry]
name = "ragdoll"
version = "0.1.0"
description = "Reusable Abstraction Language Layer for General-purpose & Domain-Oriented Computing"
authors = ["Albert Shi <heng.shi@sjtu.edu.cn>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.9,<3.12"

# We put zero deps here since we want all deps are explictly handled by conda
# this improves the reproducibility
#
# [tool.poetry.dev-dependencies]
# pytest = "^6.2.5"
numpy = "1.23.4"
pybind11 = "2.10.4"
pandas = "1.3.0"
seaborn = "0.12.2"
matplotlib = "3.6.2"
torch = "2.0.0"
nanobind = "^2.2.0"
torchvision = "0.15.1"
torchaudio = "2.0.1"
torchtext = "0.15.1"
tensorflow-gpu = "2.8"
python-dotenv = "^1.0.1"
pytest = "^8.3.3"

[[tool.poetry.packages]] 
include = "ragdoll"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
build-cpp = "build:main"
